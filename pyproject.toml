[project]
name = "model-gate"
version = "0.1.0"
description = "A fast, lightweight LLM gateway with a litellm-compatible API, built on the OpenAI SDK."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Kye Gomez", email = "kye@swarms.world" }]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.68",
    "pydantic>=2.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
fast = ["orjson>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 70
target-version = "py310"

[tool.ruff.lint]
# Pyflakes, pycodestyle errors and import order, the rules swarms lints with.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"model_gate/__init__.py" = ["F401"]
"tests/**" = ["E402", "E721", "E722", "F401", "F402"]

[tool.black]
line-length = 70

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
